<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mythic Realms</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
    <div id="gameTitle">MYTHIC REALMS</div>
    <div id="location">Evergreen Town</div>
</div>

<canvas id="game"></canvas>

<div id="dialogue" class="hidden">
    <div id="dialogueText">
        Welcome to Mythic Realms.
    </div>
</div>

<div id="controls">

    <div class="row">
        <button id="up">▲</button>
    </div>

    <div class="row">
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>
<button id="interact">A</button>
</div>

<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>

</body>
</html>
